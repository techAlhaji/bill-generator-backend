                type: string
              totalMinor:
                type: string

    PublicInvoiceEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PublicInvoice'

    VerifyPaymentRequest:
      type: object
      required: [transactionHash, paymentMethod]
      properties:
        transactionHash:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          example: 3389e9f1680a379f3d15c48111ec8b4576978160b41fa1433065a636304b295a
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        payerWalletAddress:
          type: string
          example: GABC...

    VerifyPaymentSuccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, invoiceStatus, transactionHash, verifiedAt]
          properties:
            status:
              type: string
              example: CONFIRMED
            invoiceStatus:
              $ref: '#/components/schemas/InvoiceStatus'
            transactionHash:
              type: string
            amountStroops:
              type: string
            excessStroops:
              type: string
            verifiedAt:
              type: string
              format: date-time

    Payment:
      type: object
      required: [id, invoiceId, txHash, paymentMethod, payerAddress, recipientAddress, amountStroops, status, verifiedAt]
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        txHash:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        payerAddress:
          type: string
        recipientAddress:
          type: string
        assetIdentifier:
          type: string
        amountStroops:
          type: string
        excessStroops:
          type: string
        ledgerSequence:
          type: integer
        status:
